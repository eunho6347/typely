<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Typely – 웹툰·웹소설 추천 & 가격비교</title>
  <style>
    :root{
      --bg:#f4f7fb;
      --card:#ffffff;
      --muted:#6b7280;
      --text:#1f2937;
      --accent:#3b82f6;
      --accent-2:#60a5fa;
      --ok:#16a34a;
      --mid:#eab308;
      --bad:#ef4444;
      --chip:#e5ecf8;
      --chip-brd:#d1d9ec;
      --pill:#e9eef9;
      --brd:#d8dee9;
      --shadow:0 8px 20px rgba(0,0,0,.1);
    }
    *{box-sizing:border-box}
    html,body{height:100%}
    body{margin:0;font:16px/1.6 system-ui, -apple-system, Segoe UI, Roboto, Noto Sans KR, Helvetica, Arial, Apple Color Emoji; color:var(--text); background:var(--bg)}
    a{color:inherit; text-decoration:none}
    .container{max-width:1200px;margin:0 auto;padding:20px}
    header{position:sticky;top:0;z-index:20;background:#ffffff;box-shadow:0 2px 6px rgba(0,0,0,.05)}
    .nav{display:flex;align-items:center;gap:14px;padding:12px 20px}
    .logo{font-weight:800;letter-spacing:.3px;color:var(--accent)}
    .search{flex:1;display:flex;gap:8px}
    .search input{flex:1;padding:12px 14px;border-radius:12px;border:1px solid var(--brd);background:#ffffff;color:var(--text)}
    .btn{padding:10px 14px;border-radius:10px;border:1px solid var(--brd);background:#ffffff;color:var(--text);cursor:pointer}
    .btn.primary{background:linear-gradient(180deg,var(--accent),var(--accent-2));border:none;color:white}

    .hero{display:grid;grid-template-columns:1.6fr .9fr;gap:20px;margin-top:18px}
    .panel{background:var(--card);border:1px solid var(--brd);border-radius:16px;box-shadow:var(--shadow)}
    .panel h2{margin:0;padding:18px 20px;border-bottom:1px solid var(--brd)}
    .chips{display:flex;flex-wrap:wrap;gap:8px;padding:14px 20px}
    .chip{padding:8px 12px;border-radius:999px;border:1px solid var(--chip-brd);background:var(--chip);font-size:13px;color:var(--muted)}
    .toggle{display:flex;gap:8px;padding:0 20px 16px}

    .cards{display:grid;grid-template-columns:repeat(3,1fr);gap:14px;padding:16px}
    @media (max-width:1000px){.hero{grid-template-columns:1fr}.cards{grid-template-columns:repeat(2,1fr)}}
    @media (max-width:640px){.cards{grid-template-columns:1fr}}
    .card{background:var(--card);border:1px solid var(--brd);border-radius:14px;overflow:hidden;box-shadow:var(--shadow)}
    .thumb {
      height: 180px; 
      background:#e5ecf8;
      border-bottom:1px solid var(--brd);
    }

    .content{padding:14px}
    .title{font-weight:700;margin:0 0 6px}
    .meta{font-size:12px;color:var(--muted)}
    .pill-row{display:flex;gap:8px;flex-wrap:wrap;margin:10px 0 6px}
    .pill{padding:6px 10px;border-radius:999px;background:var(--pill);border:1px solid var(--brd);font-size:12px}
    .prices{margin:10px 0;background:#f8fafc;border:1px dashed var(--brd);border-radius:10px;padding:10px}
    .prices b{color:var(--accent)}
    .actions{display:flex;gap:8px;margin-top:8px}

    .light{width:14px;height:14px;border-radius:50%}
    .ok{background:var(--ok)}.mid{background:var(--mid)}.bad{background:var(--bad)}
    .signal{display:flex;gap:8px;align-items:center}

    .section{margin-top:24px}
    .section h3{margin:0 0 10px 0}

    .grid-3{display:grid;grid-template-columns:repeat(3,1fr);gap:12px}
    @media (max-width:900px){.grid-3{grid-template-columns:repeat(2,1fr)}}
    @media (max-width:640px){.grid-3{grid-template-columns:1fr}}

    footer{margin:40px 0 20px;border-top:1px solid var(--brd);padding-top:14px;color:var(--muted);font-size:14px;text-align:center}
  </style>
</head>
<body>
  <header>
    <div class="nav container">
      <div class="logo">Typely</div>
      <nav style="display:flex;gap:14px;flex-wrap:wrap">
        <a href="#">홈</a>
        <a href="#">추천</a>
        <a href="#">가격비교</a>
        <a href="#">커뮤니티</a>
        <a href="#">신인작가</a>
      </nav>
      <div class="search">
        <input id="q" placeholder="제목·키워드·감정톤 검색 (예: 설레는 복수극)" />
        <button class="btn">검색</button>
      </div>
      <button class="btn primary">로그인</button>
    </div>
  </header>

  <main class="container">
    <section class="hero">
      <div class="panel" id="todayPanel">
        <h2>오늘의 웹툰 추천</h2>
        <div class="chips">
          <span class="chip">감정톤: 설레는</span>
          <span class="chip">장르: 복수·로맨스</span>
          <span class="chip">문체: 현실대사</span>
          <span class="chip">불호: BL/고어 미노출</span>
        </div>
        <div class="cards" id="cards"></div>
      </div>

      <aside class="panel">
        <h2>빠른 설정</h2>
        <div class="chips">
          <span class="chip">불호 숨기기: BL</span>
          <span class="chip">불호 숨기기: 성인</span>
          <span class="chip">세일만 보기</span>
          <span class="chip">완결작 우선</span>
        </div>
        <div class="toggle">
          <button class="btn" onclick="openOnboarding()">취향 테스트 다시하기</button>
          <button class="btn" onclick="alert('가격 하락 알림이 켜졌습니다.')">가격 하락 알림</button>
        </div>
        <div class="section">
          <h3>이주의 신인작가 PICK</h3>
          <div class="grid-3" id="rookies"></div>
        </div>
      </aside>
    </section>

    <section class="section">
      <h3>커뮤니티 인기 글</h3>
      <div class="grid-3" id="community"></div>
    </section>

    <footer>
      © 2025 콘텐츠 도파민 · <a href="#">이용약관</a> · <a href="#">개인정보처리방침</a> · <a href="#">문의</a>
    </footer>
  </main>

  <script>
    const books = [
  {
    id: 1,
    title: '로그아웃 불가 서버',
    summary: '로그아웃 불가 폐쇄 서버에서 벌어지는 SF 생존 스릴러',
    img: 'images/webtoon/logout-server.png',
    tone: ['긴장감', '몰입'],
    tags: ['SF', '서바이벌'],
    prices: {리디: 2500, 카카오: 2600, 네이버: 2700}
  },
  {
    id: 2,
    title: '캠퍼스 헌터즈',
    summary: '낮엔 공강, 밤엔 마수 사냥. 캠퍼스에 열린 게이트를 막는 3인조',
    img: 'images/webtoon/campus-hunters.png',
    tone: ['액션', '학원물'],
    tags: ['현대 판타지', '헌터물'],
    prices: {리디: 2800, 카카오: 2900, 네이버: 3000}
  },
  {
    id: 3,
    title: '퇴근 후 히어로',
    summary: '낮엔 회사원, 밤엔 도시의 히어로. 지하철 안에서 시작되는 이중생활',
    img: 'images/webtoon/afterwork-hero.png',
    tone: ['코미디', '히어로'],
    tags: ['일상', '액션'],
    prices: {리디: 2300, 카카오: 2400, 네이버: 2500}
  }
];

    const rookies = [
  {
    title: '초보 작가의 모험',
    votes: 124,
    img: 'images/rookies/rookie-1.png'
  },
  {
    title: '밤의 파편',
    votes: 98,
    img: 'images/rookies/rookie-2.png'
  },
  {
    title: '사막의 연가',
    votes: 76,
    img: 'images/rookies/rookie-3.png'
  }
];
    const hotPosts=[
      {title:'INFJ 독자들 모여라(추천 10선)', stats:'좋아요 324 · 댓글 88'},
      {title:'[세일정보] 이번주 리디 광폭세일 총정리', stats:'좋아요 210 · 댓글 52'},
      {title:'오늘의 도파민 후기 공유', stats:'좋아요 145 · 댓글 33'}
    ];

    const el=(tag,attrs={},children=[])=>{
      const n=document.createElement(tag);
      Object.entries(attrs).forEach(([k,v])=>{
        if(k==='class') n.className=v; else if(k==='html') n.innerHTML=v; else n.setAttribute(k,v);
      });
      (Array.isArray(children)?children:[children]).filter(Boolean).forEach(c=>n.appendChild(typeof c==='string'?document.createTextNode(c):c));
      return n;
    }

    function priceRow(prices){
      const entries=Object.entries(prices).sort((a,b)=>a[1]-b[1]);
      const best=entries[0];
      const row=el('div',{class:'prices'});
      const line=entries.map(([name,won])=>`${name} <b>${won.toLocaleString()}원</b>`).join(' · ');
      row.innerHTML=`<div style="font-size:13px">${line}</div><div style="margin-top:8px;display:flex;gap:8px;flex-wrap:wrap"><a class="btn" href="#">최저가: ${best[0]}</a><button class="btn" onclick="saveFav()">찜하기</button></div>`;
      return row;
    }

    function renderCards(){
      const wrap=document.getElementById('cards');
      wrap.innerHTML='';
      books.forEach(b=>{
        const card=el('article',{class:'card'});
        card.appendChild(
          el('div', {
            class: 'thumb',
            style: `background-image:url(${b.img});background-size:cover;background-position:center;`
          })
        );
        const c=el('div',{class:'content'});
        c.appendChild(el('h4',{class:'title'},b.title));
        c.appendChild(el('div',{class:'meta'},b.summary));
        const pills=el('div',{class:'pill-row'});
        b.tone.forEach(t=>pills.appendChild(el('span',{class:'pill'},t)));
        b.tags.forEach(t=>pills.appendChild(el('span',{class:'pill'},`#${t}`)));
        c.appendChild(pills);
        c.appendChild(priceRow(b.prices));
        const actions=el('div',{class:'actions'});
        const sig=el('div',{class:'signal'},[
          el('span',{},'만족도:'),
          el('span',{class:'light bad',title:'별로였어요',onclick:'rate(this, "bad")'}),
          el('span',{class:'light mid',title:'보통이에요',onclick:'rate(this, "mid")'}),
          el('span',{class:'light ok',title:'좋았어요',onclick:'rate(this, "ok")'})
        ]);
        actions.appendChild(sig);
        c.appendChild(actions);
        card.appendChild(c);
        wrap.appendChild(card);
      })
    }

    function renderRookies(){
      const wrap=document.getElementById('rookies');
      rookies.forEach(r=>{
        const a=el('div',{class:'card'});
        a.appendChild(
          el('div', {
            class: 'thumb',
            style: `background-image:url(${r.img});background-size:cover;background-position:center;`
           })
        );

        const c=el('div',{class:'content'});
        c.appendChild(el('h4',{class:'title'},r.title));
        c.appendChild(el('div',{class:'meta'},`추천수 ${r.votes}`));
        c.appendChild(el('div',{class:'pill-row'},[
          el('span',{class:'pill'},'신인작가'),
          el('span',{class:'pill'},'홍보 배너')
        ]));
        wrap.appendChild(a);
        a.appendChild(c);
      })
    }

    function renderCommunity(){
      const wrap=document.getElementById('community');
      hotPosts.forEach(p=>{
        const a=el('div',{class:'card'});
        const c=el('div',{class:'content'});
        c.appendChild(el('h4',{class:'title'},p.title));
        c.appendChild(el('div',{class:'meta'},p.stats));
        wrap.appendChild(a); a.appendChild(c);
      })
    }

    function rate(elm,kind){
      elm.parentElement.querySelectorAll('.light').forEach(x=>x.style.outline='none');
      elm.style.outline='2px solid #fff3';
      const msg = kind==='ok' ? '좋았어요 기록 완료!' : kind==='mid'? '보통으로 기록했어요.' : '별로였어요로 기록!';
      console.log('[신호등평가]', msg);
    }
    function saveFav(){ alert('찜함에 추가했습니다. (데모)') }

    function openOnboarding(){
      alert('온보딩 심리테스트(데모): “잔잔/사이다/자극/치유 중 2개 선택” 등으로 구현 예정')
    }

    renderCards();
    renderRookies();
    renderCommunity();
  </script>
</body>
</html>
